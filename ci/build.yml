name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/saturne.exe dist/Saturne.exe
          cp install.bat uninstall.bat dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Saturne-windows
          path: dist/

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/Saturne.exe dist/install.bat dist/uninstall.bat --title "Saturne $GITHUB_REF_NAME" --generate-notes
