<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saturne</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0e'/%3E%3Ccircle cx='12' cy='12' r='4.6' fill='%23f5f5fa'/%3E%3Cellipse cx='12' cy='12' rx='9.4' ry='3.1' transform='rotate(-22 12 12)' fill='none' stroke='%238b5cf6' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Design : noir OLED, texte blanc/gris, un seul accent violet. Rail gauche, contenu, barre de lecture en bas, file d'attente en tiroir. */
:root{
  color-scheme:dark;
  --bg:#000; --panel:#08080b; --raise:#101015; --raise2:#18181f; --line:#1c1c24; --line2:#2a2a35;
  --fg:#f5f5f8; --mute:#8b8b99; --accent:#8b5cf6; --accent-hi:#a78bfa; --accent-soft:rgba(139,92,246,.15);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sw:248px; --barh:84px;
  --r-btn:10px; --r-ctl:12px; --r-sm:8px;
  --faint:#6e6e7c; --bookmark:#fbbf24; --accent-glow:rgba(139,92,246,.2);
}
html[data-radius="square"]{--r-btn:5px;--r-ctl:7px;--r-sm:4px}
html[data-radius="round"]{--r-btn:999px;--r-ctl:16px;--r-sm:10px}
html.no-motion *{transition:none!important;animation:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
svg{width:20px;height:20px;fill:currentColor;display:block;flex:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* ---------- Connexion ---------- */
.auth{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;overflow:auto;padding:24px}
.auth-card{width:min(410px,100%);padding:34px 30px 28px;border:1px solid var(--line2);border-radius:18px;background:var(--panel)}
.auth-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;letter-spacing:.32em;margin:0 0 22px}
.auth-brand svg{width:34px;height:34px}
.auth-card h2{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
.auth-card p.lead{color:var(--mute);margin:0 0 20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--raise);border-radius:var(--r-ctl);padding:4px;margin:0 0 20px}
.tabs button{padding:9px;border-radius:var(--r-sm);text-align:center;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--raise2);color:#fff}
.fld{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.fld label{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.04em}
.input{background:#000;border:1px solid var(--line2);border-radius:var(--r-btn);padding:12px 14px;width:100%;min-width:0}
.input:focus{outline:0;border-color:var(--accent)}
.input::placeholder{color:#5d5d6b}
.auth-err{color:#ff8fa8;min-height:20px;margin:2px 0 12px;font-size:13px}
.auth-card .btn{width:100%;justify-content:center;padding:13px}
.auth-foot{color:var(--mute);font-size:12px;margin:16px 0 0;text-align:center}

/* ---------- Application ---------- */
.app{height:100dvh;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"side main" "bar bar";transition:grid-template-columns .25s cubic-bezier(.2,.8,.2,1)}
.side{grid-area:side;background:#000;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.sidehead{display:flex;align-items:center;height:72px;padding:0 14px 0 25px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:14px;letter-spacing:.3em;white-space:nowrap}
.brand svg{flex:none}
.lbl,.pli b,.pli .lk,.account .who,.account>svg,.pl-head .ib{transition:opacity .22s ease,max-width .34s cubic-bezier(.4,0,.2,1)}
.lbl{display:inline-block;max-width:190px;overflow:hidden;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.nav button,.navlike{display:flex;align-items:center;gap:16px;width:100%;padding:11px 17px;border-radius:var(--r-btn);font-weight:600;font-size:14.5px;color:var(--mute);white-space:nowrap;transition:background .15s,color .15s}
.nav button:hover,.navlike:hover{color:#fff;background:var(--raise)}
.nav button.on{color:#fff;background:var(--accent-soft)}
.nav button.on svg{color:var(--accent-hi)}
.nav button svg,.navlike svg{width:21px;height:21px}
.navlike svg{transition:transform .34s cubic-bezier(.4,0,.2,1)}
.sep{height:1px;background:var(--line);margin:14px 18px 8px}
.pl-head{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 16px 0 29px;font-weight:700;font-size:13px;color:#fff;white-space:nowrap}
.scroll{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;display:flex;flex-direction:column;gap:2px;padding:0 12px}
.pli{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:var(--r-ctl);min-width:0;color:#c9c9d4;font-weight:500;white-space:nowrap}
.pli:hover,.pli.over{background:var(--raise);color:#fff}
.pli.on{background:var(--accent-soft);color:#fff}
.pli.over{outline:2px dashed var(--accent-hi);outline-offset:-2px}
.pthumb{width:36px;height:36px;border-radius:9px;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--raise2);color:#d8d8e2}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb svg{width:18px;height:18px}
.pli.on .pthumb{color:var(--accent-hi)}
.pli[data-pl="favs"] .pthumb,.libcard[data-pl="favs"] .cov,.pfp.fav{color:var(--bookmark)}
.pli b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;max-width:190px}
.pli .lk{width:14px;height:14px;color:var(--mute);max-width:14px}
.pli.create{color:var(--mute)}
.pli.create .pthumb{background:transparent;border:1.5px dashed var(--line2);color:var(--mute)}
.updbanner{margin:6px 12px 0;padding:10px 12px;border:1px solid var(--accent);border-radius:var(--r-ctl);background:var(--accent-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.updbanner .btn{padding:6px 12px;font-size:12.5px}
.updbanner b{display:block}
.account{margin:8px 12px 14px;padding:10px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:12px;min-width:0;width:calc(100% - 24px);white-space:nowrap;overflow:hidden}
.account:hover{border-color:var(--line2)}
.avatar-s{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:var(--raise2);display:grid;place-items:center;font-weight:700}
.avatar-s img{width:100%;height:100%;object-fit:cover}
.account .who{min-width:0;flex:1;max-width:150px;overflow:hidden;text-align:left}
.account .who b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account .who small{color:var(--mute);font-size:12px}
/* ---------- Contenu ---------- */
main{grid-area:main;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#000}
.topbar{padding:16px 28px;display:flex;gap:12px;align-items:center}
.circ{width:40px;height:40px;border-radius:var(--r-btn);border:1px solid var(--line2);display:grid;place-items:center;color:#fff;flex:none}
.circ:hover:not(:disabled){background:var(--raise2)}
.circ:disabled{opacity:.3;cursor:default}
.search{flex:1;min-width:0;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 18px;transition:border-color .15s}
.search:focus-within{border-color:var(--accent)}
.search svg{color:var(--mute)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:12px 0}
.search input::placeholder{color:#707080}
.spacer{flex:1}
.avatar-btn{width:42px;height:42px;border-radius:50%;overflow:hidden;border:1px solid var(--line2);background:var(--raise2);display:grid;place-items:center;font-weight:700;flex:none}
.avatar-btn:hover{border-color:var(--accent-hi)}
.avatar-btn img{width:100%;height:100%;object-fit:cover}
.menubtn{display:none}
#view{flex:1;overflow-y:auto;padding:8px 32px calc(var(--barh) + 32px);min-height:0}
.btn{background:var(--accent);color:#fff;font-weight:700;border-radius:var(--r-btn);padding:11px 22px;white-space:nowrap;display:inline-flex;align-items:center;gap:10px;transition:background .15s,transform .12s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn svg{width:18px;height:18px}
.btn.alt{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.btn.alt:hover{background:rgba(255,255,255,.14)}
.ghost{border:1px solid var(--line2);border-radius:var(--r-btn);padding:9px 18px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.ghost svg{width:18px;height:18px}
.ghost:hover{border-color:#fff}
.ghost.warn{border-color:#ff8fa8;color:#ff8fa8}
h1{font-weight:800;font-size:clamp(30px,4.4vw,52px);line-height:1.05;letter-spacing:-.035em;margin:6px 0 10px;text-wrap:balance}
h2.sh{font-weight:800;font-size:21px;letter-spacing:-.02em;margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-hi);margin:0;display:flex;align-items:center;gap:8px}
.sub{color:var(--mute);margin:0 0 18px;max-width:58ch}
.head-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sechd{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;gap:12px}
.more{color:var(--mute);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.more:hover{color:#fff}
.block{margin:0 0 32px}
.pagehead{padding:8px 0 24px}
.greet{color:var(--mute);margin:2px 0 16px}
.greet b{color:#fff}

/* ---------- Hero : sorties les plus récentes ---------- */
.hero{position:relative;height:clamp(270px,32vw,340px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000;margin:0 0 32px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .bg{position:absolute;right:0;top:0;width:76%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%);mask-image:linear-gradient(90deg,transparent 0,#000 40%)}
.slide::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#000 24%,rgba(0,0,0,.5) 55%,rgba(0,0,0,0) 100%)}
.sl-body{position:absolute;z-index:2;left:38px;top:30px;bottom:30px;display:flex;flex-direction:column;justify-content:flex-start;max-width:52%;gap:6px}
.sl-body .sl-by{margin:auto 0 14px}
.sl-body .sl-actions{min-height:44px}
.sl-title{font-weight:800;font-size:clamp(24px,3.1vw,42px);line-height:1.08;letter-spacing:-.03em;margin:6px 0 4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.sl-by{color:#c9c9d4;font-size:15px;margin:0 0 16px}
.sl-by .alink{font-weight:700;color:#fff}
.sl-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero-dots{position:absolute;z-index:3;right:24px;bottom:20px;display:flex;gap:8px;align-items:center}
.hero-dots button{width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.35);transition:width .25s,background .25s}
.hero-dots button.on{width:28px;background:#fff}
.hero-nav{position:absolute;z-index:3;right:22px;top:18px;display:flex;gap:8px}
.hero-nav button{width:34px;height:34px;border-radius:var(--r-btn);background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.hero-nav button:hover{background:rgba(255,255,255,.18)}
.hero-empty{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 38px;gap:8px}

/* ---------- Cartes ---------- */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 20px}
.shelf{list-style:none;margin:0;padding:0 0 8px;display:grid;grid-auto-flow:column;grid-auto-columns:204px;gap:20px;overflow-x:auto;scroll-snap-type:x proximity}
.shelf .card{scroll-snap-align:start}
.card{position:relative;min-width:0}
.card .thumb{display:block;width:100%;position:relative;aspect-ratio:16/11;border-radius:12px;overflow:hidden;background:var(--raise)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .thumb img{transform:scale(1.04)}
.pb{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:var(--r-ctl);background:var(--accent);color:#fff;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.card:hover .pb,.thumb:focus-visible .pb{opacity:1;transform:none}
.pb svg{width:22px;height:22px}
.card .tt{margin-top:11px}
.cacts{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.card:hover .cacts,.cacts:focus-within{opacity:1}
.cacts .ib{background:rgba(0,0,0,.72);backdrop-filter:blur(6px);color:#fff}
.card.on .tt{color:var(--accent-hi)}
.sk{aspect-ratio:16/12;border-radius:16px;background:linear-gradient(100deg,var(--raise) 30%,#1b1b24 50%,var(--raise) 70%);background-size:300% 100%;animation:sh 1.4s linear infinite}
.sk.round{aspect-ratio:1;border-radius:50%}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}

/* ---------- Listes ---------- */
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:8px 10px;border-radius:14px}
.row:hover{background:var(--raise)}
.cover{position:relative;width:92px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--raise);flex:none}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;opacity:0}
.row:hover .ov,.cover:focus-visible .ov{opacity:1}
.tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alink{color:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.alink:hover{color:#fff;text-decoration:underline}
.row.on .tt{color:var(--accent-hi)}
.dur{color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:2px}
.ib{width:36px;height:36px;border-radius:var(--r-btn);display:grid;place-items:center;color:var(--mute);flex:none;transition:background .12s,color .12s}
.ib:hover{color:#fff;background:var(--raise2)}
.ib.act{color:var(--accent-hi)}
.ib:disabled{opacity:.3;cursor:default}
.ib.sm{width:28px;height:28px}.ib.sm svg{width:16px;height:16px}

/* ---------- Bookmark animé ---------- */
.bm{overflow:visible}
.bm-out{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.bm-fill{fill:var(--bookmark);transform:translateY(100%);transition:transform .5s cubic-bezier(.22,1,.36,1)}
.bmk.on{color:var(--bookmark)}
.bmk.on .bm-fill{transform:translateY(0)}
.bmk.pop .bm{animation:bmpop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bmpop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ---------- Genres, artistes ---------- */
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tile{width:100%;aspect-ratio:16/8;border-radius:12px;padding:18px;display:flex;align-items:flex-end;font-weight:700;font-size:18px;letter-spacing:-.01em;background:var(--raise);border:1px solid var(--line);transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--accent);background:var(--raise2)}
.artists{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px}
.artist{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%;padding:14px 8px;border-radius:20px;transition:background .15s}
.artist:hover{background:var(--raise)}
.avatar{width:100%;max-width:136px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--raise2);display:grid;place-items:center;font-weight:700;font-size:38px;color:#d8d8e2}
.avatar img{width:100%;height:100%;object-fit:cover}
.artist b{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.artist small{color:var(--mute);display:block}
.asearch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 26px}
.asearch .search{max-width:460px}

/* ---------- Page Playlists ---------- */
.plhero{position:relative;border-radius:16px;border:1px solid var(--line);padding:38px 34px 34px;margin:4px 0 24px;overflow:hidden;background:radial-gradient(60% 120% at 92% 0%,var(--accent-glow),transparent 70%),#000}
.plhero h1{margin:0 0 6px;font-size:clamp(34px,5vw,58px)}
.plhero .sub{margin:0 0 22px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 18px;border-radius:var(--r-btn);border:1px solid var(--line2);font-weight:600;color:#c9c9d4}
.chip:hover{border-color:#fff;color:#fff}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sortbox{display:flex;align-items:center;gap:10px;color:var(--mute)}
.select{background:#000;border:1px solid var(--line2);border-radius:var(--r-btn);padding:8px 14px;min-width:150px;color:#fff}
.libwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:26px;align-items:start}
.libgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:24px 20px}
.libcard{position:relative;min-width:0}
.libcard>button.cov{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--raise);display:grid;place-items:center;font-weight:700;font-size:40px;color:#d8d8e2;border:1px solid var(--line);transition:border-color .15s,transform .2s}
.libcard>button.cov:hover{border-color:var(--line2);transform:translateY(-3px)}
.libcard .cov img{width:100%;height:100%;object-fit:cover}
.libcard .cov svg{width:44px;height:44px}
.libcard.create>button.cov{background:transparent;border:2px dashed var(--line2);color:var(--mute)}
.libcard.over>button.cov,.libcard.over{outline:2px dashed var(--accent-hi);outline-offset:3px;border-radius:16px}
.lc-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-top:10px}
.lc-meta>div{min-width:0}
.lc-meta b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-meta small{color:var(--faint);display:flex;align-items:center;gap:5px}
.lc-meta small svg{width:13px;height:13px}
.libside{display:flex;flex-direction:column;gap:16px}
.box{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--panel)}
.box h3{margin:0 0 14px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.mini-row{display:flex;align-items:center;gap:12px;padding:6px 4px;border-radius:12px;width:100%;min-width:0}
.mini-row:hover{background:var(--raise)}
.mini-row img{width:44px;height:44px;object-fit:cover;border-radius:10px;background:var(--raise);flex:none}
.mini-row .m{min-width:0;flex:1}
.mini-row b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row small{color:var(--mute);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row.on b{color:var(--accent-hi)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{display:flex;align-items:center;flex-direction:column;gap:8px;padding:12px 4px;border-radius:var(--r-ctl);color:var(--mute);font-size:12.5px;font-weight:600}

/* ---------- Playlist / artiste ---------- */
.banner{position:relative;min-height:280px;border-radius:16px;margin:4px 0 22px;background:var(--raise) center/cover;overflow:hidden;display:flex;align-items:flex-end;gap:24px;padding:26px;user-select:none;touch-action:pan-y;border:1px solid var(--line)}
.banner.has{cursor:grab}.banner.grab{cursor:grabbing}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.1) 80%);pointer-events:none}
.banner>*{position:relative;z-index:2}
.banner.over,.pfp.over{outline:2px dashed var(--accent-hi);outline-offset:-8px}
.pfp{width:156px;aspect-ratio:1;border-radius:12px;flex:none;overflow:hidden;position:relative;background:var(--raise2);box-shadow:0 16px 40px rgba(0,0,0,.7);cursor:pointer;display:grid;place-items:center;font-weight:800;font-size:54px;color:#d8d8e2}

.pfp svg{width:54px;height:54px}
.pfp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pfp .pov{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;background:rgba(0,0,0,.62);opacity:0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:8px;transition:opacity .15s;color:#fff}

.pfp:hover .pov,.pfp.over .pov,.pfp:focus-visible .pov{opacity:1}
.pfp.static{cursor:default}
.bmeta{min-width:0;flex:1}
.bmeta h1{margin:4px 0 6px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.title-input{font-weight:800;font-size:clamp(26px,4.4vw,48px);line-height:1.05;letter-spacing:-.04em;background:none;border:0;border-bottom:2px solid transparent;width:100%;padding:0;margin:4px 0 6px;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.title-input:hover,.title-input:focus{border-bottom-color:rgba(255,255,255,.3);outline:0}
.title-input:disabled{opacity:1;border-color:transparent}
.desc-input{background:none;border:0;border-bottom:1px solid transparent;width:100%;max-width:560px;padding:2px 0;color:#d2d2dc;margin:0 0 6px;display:block}
.desc-input:hover,.desc-input:focus{border-bottom-color:rgba(255,255,255,.3);outline:0}
.desc-input::placeholder{color:#8b8b99}
.btools{position:absolute!important;top:14px;right:14px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.banner:hover .btools,.btools:focus-within{opacity:1}
.btools button{background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border-radius:var(--r-btn);padding:8px 14px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:8px}
.btools button svg{width:16px;height:16px}
.btools button:hover{background:rgba(0,0,0,.92)}
.bhint{position:absolute!important;inset:0;display:none;place-items:center;background:rgba(0,0,0,.65);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.banner.over .bhint{display:grid}
.banner .sub{margin:0;color:#c9c9d4;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.back{margin:0 0 10px}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line2);border-radius:var(--r-ctl);padding:3px}
.seg button{display:flex;align-items:center;gap:8px;padding:7px 16px;border-radius:var(--r-btn);font-weight:600;color:var(--mute)}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--accent);color:#fff}
.privacy-note{color:var(--mute);font-size:13px;margin:10px 0 18px;display:flex;gap:8px;align-items:center}
.privacy-note svg{width:16px;height:16px;flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-sm);border:1px solid rgba(255,255,255,.22);font-size:12px;font-weight:600;color:#e6e6ee;margin-left:10px;vertical-align:middle}
.badge svg{width:13px;height:13px}

/* ---------- Réglages ---------- */
.setgrid{display:grid;gap:12px;max-width:700px}
.set{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.set h3{margin:0 0 2px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.set p{margin:0;color:var(--mute);max-width:46ch}
.set .grow{flex:1;min-width:200px}
.switch{width:46px;height:28px;border-radius:var(--r-btn);background:var(--line2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:var(--r-sm);background:#fff;transition:transform .2s}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(18px)}
.profile{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile .who2 b{display:block;font-size:17px}
.profile .who2 small{color:var(--mute)}
.profile .avatar-big{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--raise2);display:grid;place-items:center;font-weight:800;font-size:28px;border:1px solid var(--line2);cursor:pointer;position:relative}
.profile .avatar-big img{width:100%;height:100%;object-fit:cover}
.profile .avatar-big:hover::after{content:"Changer";position:absolute;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.empty{color:var(--mute);padding:22px 0}
.err{color:#ff8fa8}
.errbox{background:var(--raise);border:1px solid var(--line2);border-radius:16px;padding:16px 18px;max-width:640px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- Réglages ---------- */
.setlayout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:34px;align-items:start}
.setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.setnav button{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-btn);font-weight:600;color:var(--mute);white-space:nowrap}
.setnav button:hover{color:#fff;background:var(--raise)}
.setnav button.on{color:#fff;background:var(--accent-soft)}
.setnav button.on svg{color:var(--accent-hi)}
.setnav svg{width:19px;height:19px}
.setpane h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.setpane .lead{color:var(--mute);margin:0 0 22px;max-width:60ch}
.setgroup{display:grid;gap:10px;max-width:740px}
.setgroup h4{margin:18px 0 2px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.setgroup h4:first-child{margin-top:0}
.set.danger{border-color:rgba(255,143,168,.35)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:var(--r-sm);background:var(--c);border:2px solid transparent;outline:2px solid transparent;outline-offset:2px}
.swatch.on{outline-color:#fff}
.kbd{display:inline-block;padding:2px 8px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;font:600 12px var(--font);color:#d8d8e2;background:var(--raise)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 16px;color:var(--mute);margin:0}
.kv b{color:#fff;font-weight:600;word-break:break-all}
.notes{white-space:pre-wrap;color:#c9c9d4;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px 14px;max-height:180px;overflow:auto;margin:10px 0 0;width:100%}
.upstat{display:flex;align-items:center;gap:10px;color:var(--mute)}
.upstat .dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.upstat.ok .dot{background:#4ade80}.upstat.new .dot{background:var(--accent-hi)}
/* ---------- Fenêtres modales ---------- */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:120;display:grid;place-items:center;padding:20px}
.mbox{width:min(470px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:24px}
.mbox h3{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
.mbox p{color:var(--mute);margin:0 0 14px}
.mbox .fld{margin:0 0 12px}
.mactions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.merr{color:#ff8fa8;min-height:18px;font-size:13px;margin:2px 0 0}
.codebox{width:100%;height:130px;resize:none;background:#000;border:1px solid var(--line2);border-radius:var(--r-btn);padding:10px 12px;font:12px/1.4 ui-monospace,Consolas,monospace;color:#d8d8e2;word-break:break-all}
.codebox:focus{outline:0;border-color:var(--accent)}
.avatar-edit{display:flex;align-items:center;gap:18px;margin:0 0 16px}
.avatar-edit .avatar-big{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--raise2);display:grid;place-items:center;font-weight:800;font-size:30px;border:1px solid var(--line2);position:relative;flex:none;cursor:pointer}
.avatar-edit .avatar-big img{width:100%;height:100%;object-fit:cover}
.avatar-edit .avatar-big::after{content:"Changer";position:absolute;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:0;transition:opacity .15s}
.avatar-edit .avatar-big:hover::after,.avatar-edit .avatar-big.over::after{opacity:1}
.avatar-edit .avatar-big.over{outline:2px dashed var(--accent-hi);outline-offset:3px}
@media (max-width:900px){.setlayout{grid-template-columns:minmax(0,1fr);gap:18px}.setnav{flex-direction:row;overflow-x:auto;position:static}.kv{grid-template-columns:1fr}}

/* ---------- Finitions ---------- */
svg.i{fill:none}
.cov>img,.pthumb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cov>.mosaic,.pthumb>.mosaic,.pfp>.mosaic{position:absolute;inset:0;width:100%;height:100%}
.pthumb{position:relative}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:#000;overflow:hidden}
.mosaic img{position:static;width:100%;height:100%;min-height:0;object-fit:cover;display:block}
.card .tt{margin-top:11px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;line-height:1.35}
.welcome{border:1px dashed var(--line2);border-radius:var(--r-ctl);padding:22px 24px;margin:0 0 24px}
.welcome h3{margin:0 0 4px;font-size:18px}
.welcome p{color:var(--mute);margin:0 0 16px;max-width:52ch}
input[type=range]:hover::-webkit-slider-runnable-track{height:6px}
input[type=range]:hover::-webkit-slider-thumb{margin-top:-3.5px}
/* Menus déroulants */
.dd-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;min-width:176px;padding:9px 14px;border:1px solid var(--line2);border-radius:var(--r-btn);background:#000;color:#fff;font-weight:600;transition:border-color .15s}
.dd-btn:hover,.dd-btn[aria-expanded=true]{border-color:var(--accent)}
.dd-btn svg{width:16px;height:16px;color:var(--mute);transition:transform .22s}
.dd-btn[aria-expanded=true] svg{transform:rotate(180deg)}
.ddmenu{position:fixed;z-index:140;background:var(--raise);border:1px solid var(--line2);border-radius:var(--r-ctl);padding:6px;box-shadow:0 22px 56px rgba(0,0,0,.85);display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto;animation:popIn .14s ease}
.ddmenu button{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 12px;border-radius:var(--r-sm);text-align:left;white-space:nowrap;color:#d8d8e2;font-weight:500}
.ddmenu button:hover,.ddmenu button:focus-visible{background:var(--raise2);color:#fff;outline:0}
.ddmenu button.sel{color:#fff;font-weight:700}
.ddmenu svg{width:16px;height:16px;color:var(--accent-hi)}
/* Infobulle */
.tip{position:fixed;z-index:150;pointer-events:none;background:#000;border:1px solid var(--line2);color:#fff;padding:4px 9px;border-radius:var(--r-sm);font-size:12px;font-weight:600;white-space:nowrap}
.tip[data-side=top]{transform:translate(-50%,-100%)}
.tip[data-side=right]{transform:translate(0,-50%)}
/* Now playing */
.np-page{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:44px;align-items:center;padding-top:10px}
.np-art{aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--raise);border:1px solid var(--line);position:relative}
.np-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.np-h{margin:26px 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.np-list{display:grid;gap:2px;max-width:440px}
.now img,.now .tt{cursor:pointer}
@media (max-width:900px){.np-page{grid-template-columns:minmax(0,1fr);gap:22px}}
/* Changelog */
.cl{display:grid;gap:10px}
.cl-item{border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--panel);overflow:hidden}
.cl-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;transition:background .15s}
.cl-head:hover{background:var(--raise)}
.cl-v{font-weight:800;font-size:16px}
.cl-t{color:#c9c9d4;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-d{color:var(--faint);font-size:12.5px;white-space:nowrap}
.cl-head svg{width:18px;height:18px;transition:transform .3s;color:var(--mute);flex:none}
.cl-item.open .cl-head svg{transform:rotate(180deg)}
.cl-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1)}
.cl-item.open .cl-body{grid-template-rows:1fr}
.cl-in{overflow:hidden;min-height:0;padding:0 18px}
.cl-list{padding:2px 0 16px}
.cl-row{display:flex;gap:12px;align-items:flex-start;padding:5px 0;color:#d6d6de}
.cl-tag{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r-sm);margin-top:2px;min-width:80px;text-align:center}
.cl-tag.new{background:var(--accent-soft);color:var(--accent-hi)}
.cl-tag.improved,.cl-tag.fixed{background:var(--raise2);color:#c9c9d4}
.badge2{font-size:11px;font-weight:700;padding:2px 8px;border-radius:var(--r-sm);background:var(--raise2);color:#d8d8e2}
.badge2.on{background:var(--accent-soft);color:var(--accent-hi)}
@media (max-width:600px){.cl-t,.cl-d{display:none}}
/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
#view.enter{animation:fadeUp .24s ease}

.mback{animation:fadeIn .16s ease}
.mbox{animation:popIn .22s cubic-bezier(.2,.9,.3,1.15)}

.qdrawer{position:fixed;top:0;right:0;bottom:var(--barh);width:min(380px,100vw);background:#000;border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;padding:20px 16px 12px;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.7)}
.qdrawer.open{transform:none}
.qdrawer.over{outline:2px dashed var(--accent-hi);outline-offset:-6px}
.nuhead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.nuhead b{font-size:18px;font-weight:800}
.nuhead .r{display:flex;align-items:center;gap:6px}

.hint{color:var(--mute);font-size:13px;padding:8px 6px}

/* ---------- Barre de lecture ---------- */
.bar{grid-area:bar;display:grid;grid-template-columns:minmax(210px,300px) minmax(120px,1fr) auto auto;gap:22px;align-items:center;padding:14px 22px;background:#000;border-top:1px solid var(--line)}
.now{display:flex;align-items:center;gap:14px;min-width:0}
.now img,.now .ph{width:58px;height:58px;object-fit:cover;border-radius:10px;background:var(--raise);flex:none;display:grid;place-items:center;color:var(--mute)}
.now .txt{min-width:0;flex:1}
.seekbox{display:flex;align-items:center;gap:16px;min-width:0}
.seekbox span{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrls{display:flex;align-items:center;gap:6px}
.playbtn{width:44px;height:44px;border-radius:var(--r-ctl);background:var(--accent);color:#fff;display:grid;place-items:center;transition:background .15s,transform .12s}
.playbtn:hover{filter:brightness(1.12);transform:scale(1.06)}
.playbtn svg{width:24px;height:24px}
.volume{display:flex;align-items:center;gap:6px;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:16px;background:none;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p),#2a2a35 var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:#2a2a35}
input[type=range]::-moz-range-progress{height:4px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;margin-top:-4.5px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
#vol{width:104px;flex:none}

/* Lecteur YouTube : présent mais invisible, seul le son compte. */

.menu{position:fixed;z-index:70;width:240px;background:var(--raise);border:1px solid var(--line2);border-radius:16px;padding:6px;box-shadow:0 22px 56px rgba(0,0,0,.85);display:flex;flex-direction:column;gap:2px;max-height:340px;overflow-y:auto}

.menu>button:hover{background:var(--raise2)}
.menu>button svg{width:18px;height:18px;color:var(--mute)}
.menu>button.danger{color:#ff8fa8}
.menu form{display:flex;gap:6px;padding:4px}
.menu .input{padding:9px 12px}
.toast{position:fixed;left:50%;bottom:calc(var(--barh) + 20px);transform:translateX(-50%);background:#fff;color:#000;padding:10px 20px;border-radius:var(--r-ctl);font-weight:600;z-index:90;max-width:calc(100vw - 32px);text-align:center}
.scrim{display:none}

/* ---------- Barre latérale repliée ---------- */
@media (min-width:901px){
  .app.collapsed{--sw:80px}

let saveTimer = 0, saveWarned = false;
const payload = () => ({v:2, playlists:S.playlists, queue:S.queue, cur:S.cur, shuffle:S.shuffle, repeat:S.repeat, volume:S.volume, history:S.history, cc:S.cc, collapsed:S.collapsed, defaultPrivacy:S.defaultPrivacy, settings:S.settings});
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await http('/api/data', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload())}); saveWarned = false; }
    catch (e) { if (e.status === 401) return showAuth('Ta session a expiré, reconnecte-toi.'); if (!saveWarned) { saveWarned = true; toast('Enregistrement impossible : ' + e.message); } }
  }, 700);
}
function applyData(d){
  S.playlists = (Array.isArray(d.playlists) ? d.playlists : []).map(p => ({...p, tracks:Array.isArray(p.tracks) ? p.tracks : [], visibility: p.id === 'favs' ? 'private' : (p.visibility === 'public' ? 'public' : 'private')}));
  S.queue = Array.isArray(d.queue) ? d.queue : [];
  S.cur = Number.isInteger(d.cur) && d.cur < S.queue.length ? d.cur : (S.queue.length ? 0 : -1);
  S.shuffle = !!d.shuffle; S.repeat = ['off','all','one'].includes(d.repeat) ? d.repeat : 'off'; S.volume = Number.isFinite(d.volume) ? d.volume : 80;
  S.history = Array.isArray(d.history) ? d.history.slice(0, 24) : []; S.cc = COUNTRIES[d.cc] ? d.cc : 'JP'; S.collapsed = !!d.collapsed;
  S.defaultPrivacy = d.defaultPrivacy === 'public' ? 'public' : 'private';
  S.settings = {...DEFAULT_SETTINGS, ...(d.settings && typeof d.settings === 'object' ? d.settings : {})};
  if (!S.settings.remember) { S.queue = []; S.cur = -1; }
  applyTheme();
  let f = S.playlists.find(p => p.id === 'favs');
  if (!f) { f = {id:'favs', tracks:[], created:Date.now()}; S.playlists.unshift(f); }
  f.name = 'Bookmarks'; f.system = true; f.visibility = 'private';
}

let authMode = 'in';

async function logout(){ try { await send('/api/auth/logout', {}); } catch {} location.reload(); }

/* ---------- Lecteur YouTube (caché : seul le son est utilisé) ---------- */
let player = null, ready = false, ytLoading = false, pendingLoad = false, playing = false, errStreak = 0, seeking = false, lastLogged = '';
function loadYT(){
  if (ytLoading) return; ytLoading = true;
  window.onYouTubeIframeAPIReady = () => { player = new YT.Player('yt', {width:'200', height:'200', playerVars:{playsinline:1, rel:0, controls:0, disablekb:1}, events:{onReady, onStateChange, onError}}); };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => toast('Le lecteur n\'a pas pu se charger. Vérifie ta connexion puis relance Saturne.');
  document.head.appendChild(s);
}
function onReady(){
  ready = true; player.setVolume(S.volume);
  const t = current();
  if (t) { if (pendingLoad) player.loadVideoById(t.id); else player.cueVideoById(t.id); }
  pendingLoad = false;
}
function onStateChange(e){
  playing = e.data === 1 || e.data === 3;
  if (e.data === 1) {
    errStreak = 0; const t = current();
    if (t) {
      const dur = player.getDuration(); if (!t.duration && dur) { t.duration = Math.round(dur); save(); }
      if (lastLogged !== t.id) { lastLogged = t.id; S.history = [slim(t), ...S.history.filter(x => x.id !== t.id)].slice(0, 24); save(); if (S.view.type === 'home' || S.view.type === 'library') renderView(); }
    }
  }
  if (e.data === 0) { if (S.settings.autoplay || S.repeat === 'one') next(true); else playing = false; }
  renderBar();
}
function onError(){
  errStreak++;
  if (errStreak < Math.min(5, S.queue.length)) { toast('Ce titre ne peut pas être lu, je passe au suivant'); next(false); }
  else toast('Ce titre ne peut pas être lu');
}
function loadCurrent(){
  const t = current(); if (!t) return;
  if (ready) player.loadVideoById(t.id); else pendingLoad = true;
  save(); render();
}
function rebuildOrder(){
  const idx = S.queue.map((_, i) => i);
  if (S.shuffle) { const rest = shuffleArr(idx.filter(i => i !== S.cur)); S.order = S.cur >= 0 ? [S.cur, ...rest] : rest; S.pos = S.cur >= 0 ? 0 : -1; }
  else { S.order = idx; S.pos = S.cur; }
}
function playList(tracks, i){ S.queue = tracks.map(slim); S.cur = i; rebuildOrder(); const p = curPl(); if (p) { p.lastPlayed = Date.now(); } loadCurrent(); }
function jump(i){ S.cur = i; S.pos = S.order.indexOf(i); loadCurrent(); }
function next(auto){
  if (!S.queue.length) return;
  if (auto && S.repeat === 'one' && ready) { player.seekTo(0, true); player.playVideo(); return; }
  if (S.pos + 1 < S.order.length) S.pos++;
  else if (S.repeat === 'all') { if (S.shuffle) { S.cur = -1; rebuildOrder(); } S.pos = 0; }
  else { if (!auto) toast('Fin de la file d\'attente'); return; }
  S.cur = S.order[S.pos]; loadCurrent();
}
function prev(){
  if (!current() || !ready) return;
  if (player.getCurrentTime() > 3 || S.pos <= 0) { player.seekTo(0, true); return; }
  S.pos--; S.cur = S.order[S.pos]; loadCurrent();
}
function togglePlay(){
  if (!current()) return toast('Choisis d\'abord un titre');
  if (!ready) { pendingLoad = true; return; }
  if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
}
function addToQueue(t){
  S.queue.push(slim(t));
  if (S.cur < 0) { S.cur = S.queue.length - 1; rebuildOrder(); loadCurrent(); }
  else { S.order.push(S.queue.length - 1); save(); render(); }
  toast('Ajouté à la file d\'attente');
}
function stopPlayer(){ playing = false; if (ready) player.stopVideo(); }
function removeFromQueue(i){
  const wasCur = i === S.cur;
  S.queue.splice(i, 1);
  if (i < S.cur) S.cur--;
  if (wasCur) {
    if (S.queue.length) { S.cur = Math.min(i, S.queue.length - 1); rebuildOrder(); loadCurrent(); return; }
    S.cur = -1; stopPlayer();
  }
  rebuildOrder(); save(); render();
}
function clearQueue(){
  const prev = [...S.queue], prevCur = S.cur; if (!prev.length) return;
  S.queue = []; S.cur = -1; rebuildOrder(); stopPlayer(); save(); render();
  toast('File d\'attente vidée', {undo:() => { S.queue = prev; S.cur = prevCur; rebuildOrder(); save(); render(); }});
}

/* ---------- Bookmarks (mise à jour sur place pour que l'animation de remplissage joue) ---------- */

  });
}
function toggleFav(t){
  const f = favs(), i = f.tracks.findIndex(x => x.id === t.id), on = i < 0;
  if (on) f.tracks.unshift(slim(t)); else f.tracks.splice(i, 1);

const bmBtn = (t, extra = '') => { const on = isFav(t.id); return `<button class="ib bmk ${on?'on':''} ${extra}" data-act="fav" data-bm="${esc(t.id)}" aria-pressed="${on}" aria-label="${on?'Retirer des bookmarks':'Ajouter aux bookmarks'}">${bmSvg}</button>`; };

/* ---------- Données YouTube (via le serveur Rust) ---------- */
const ytId = s => { const m = s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/); return m ? m[1] : null; };
const dedupe = l => { const seen = new Set(); return l.filter(t => !seen.has(t.id) && seen.add(t.id)); };
const fetchTracks = async (q, gl) => (await api('search', {type:'video', q, gl:gl || ''})).items;
const HOME_QUERIES = ['J-POP 人気曲 MV', 'J-POP official music video'];
let homeSeq = 0;
async function loadHome(fresh){
  if (!fresh && S.home.main.tracks.length) return;
  const seq = ++homeSeq, H = S.home;
  H.main = {tracks:[], loading:true, error:''}; H.fresh = {tracks:[], loading:true, error:''};
  SHELVES.forEach(s => H.shelves[s.key] = {tracks:[], loading:true, error:''}); render();
  const done = fn => v => { if (seq === homeSeq) { fn(v); if (S.view.type === 'home') renderView(); } };
  await Promise.all([
    api('new', {gl:'JP'}).then(done(j => H.fresh = {tracks:j.items, loading:false, error:''}), done(e => H.fresh = {tracks:[], loading:false, error:errText(e)})),
    Promise.all(HOME_QUERIES.map(q => fetchTracks(q, 'JP'))).then(done(a => H.main = {tracks:dedupe(a.flat()), loading:false, error:''}), done(e => H.main = {tracks:[], loading:false, error:errText(e)})),
    ...SHELVES.map(s => fetchTracks(s.q, s.cc).then(done(t => H.shelves[s.key] = {tracks:t, loading:false, error:''}), done(e => H.shelves[s.key] = {tracks:[], loading:false, error:errText(e)})))
  ]);
  if (seq === homeSeq) render();
}
let listSeq = 0;
async function loadList(v){
  const seq = ++listSeq;
  S.list = {title:v.title, eyebrow:v.eyebrow || 'Genre', q:v.q, cc:v.cc || '', loading:true, error:'', tracks:[]}; render();
  try { const t = v.q === '__new__' ? (await api('new', {gl:'JP'})).items : await fetchTracks(v.q, v.cc || S.cc); if (seq !== listSeq) return; S.list.tracks = t; }
  catch (e) { if (seq !== listSeq) return; S.list.error = errText(e); }
  S.list.loading = false; render();
}
let searchSeq = 0;
async function runSearch(q){
  const seq = ++searchSeq; S.search = {q, tracks:[], loading:true, error:''}; render();
  try {
    const id = ytId(q), t = id ? [await api('video', {id})] : await fetchTracks(q, S.cc);
    if (seq !== searchSeq) return; S.search.tracks = t;
  } catch (e) { if (seq !== searchSeq) return; S.search.error = errText(e); }
  S.search.loading = false; render();
}
async function resolveArtist(name){
  const k = 'saturne.artist.' + name;
  try { const c = JSON.parse(localStorage.getItem(k) || 'null'); if (c) return c; } catch {}
  const first = (await api('search', {type:'channel', q:name})).items[0];
  if (first) { try { localStorage.setItem(k, JSON.stringify(first)); } catch {} }
  return first;
}
let artistsSeq = 0;
async function loadArtists(){
  const seq = ++artistsSeq;
  S.artists = {items:[], loading:true, error:'', mode:'popular', query:''}; render();
  let idx = 0, firstErr = null, timer = 0;
  const redraw = () => { if (!timer) timer = setTimeout(() => { timer = 0; if (seq === artistsSeq && S.view.type === 'artists') renderView(); }, 120); };
  const worker = async () => {
    while (idx < ARTISTS.length && seq === artistsSeq) {
      const i = idx++;
      try { const a = await resolveArtist(ARTISTS[i]); if (a && seq === artistsSeq) { S.artists.items[i] = a; redraw(); } } catch (e) { firstErr = firstErr || e; }
    }
  };
  await Promise.all([worker(), worker()]);
  if (seq !== artistsSeq) return;
  S.artists.loading = false;
  if (!S.artists.items.filter(Boolean).length && firstErr) S.artists.error = errText(firstErr);
  render();
}
async function searchArtists(q){
  const seq = ++artistsSeq;
  S.artists = {items:[], loading:true, error:'', mode:'search', query:q}; render();
  try { const items = (await api('search', {type:'channel', q})).items; if (seq !== artistsSeq) return; S.artists.items = items; }
  catch (e) { if (seq !== artistsSeq) return; S.artists.error = errText(e); }
  S.artists.loading = false; render();
}
let artistSeq = 0;
async function loadArtist(id){
  const seq = ++artistSeq;
  const known = S.artists.items.find(a => a && a.id === id);
  S.artist = {id, info: known ? {...known} : null, tracks:[], loading:true, error:''}; render();
  try {
    const j = await api('channel', {id});
    if (seq !== artistSeq) return;
    S.artist.info = {...(S.artist.info || {}), ...j.info, subsText: j.info.subsText || (S.artist.info && S.artist.info.subsText) || ''};
    S.artist.tracks = j.tracks;
  } catch (e) { if (seq !== artistSeq) return; S.artist.error = errText(e); }
  S.artist.loading = false; render();
}
async function loadCommunity(){
  S.community.loading = true; S.community.error = ''; if (S.view.type === 'library') renderView();
  try { S.community.items = (await http('/api/public')).items; S.community.loaded = true; }
  catch (e) { S.community.error = errText(e); }
  S.community.loading = false; if (S.view.type === 'library') renderView();
}
async function loadPub(owner, id){
  S.pub = {owner, id, data:null, loading:true, error:''}; render();
  try { const j = await api('public/playlist', {owner, id}); if (S.pub.id !== id) return; S.pub.data = j.playlist; }
  catch (e) { S.pub.error = e.message; }
  S.pub.loading = false; if (S.view.type === 'pubpl') render();
}

/* ---------- Navigation (avec précédent / suivant) ---------- */
function go(v, push = true){
  closeDrawer(); closeMenu();
  if (push) { S.hist = S.hist.slice(0, S.hpos + 1); S.hist.push(v); S.hpos = S.hist.length - 1; }
  S.view = v; render(); $('#view').scrollTop = 0;
  if (v.type === 'home') loadHome();
  else if (v.type === 'artists' && !S.artists.items.filter(Boolean).length && !S.artists.loading) loadArtists();
  else if (v.type === 'artist') loadArtist(v.id);
  else if (v.type === 'list') loadList(v);
  else if (v.type === 'search' && v.q && S.search.q !== v.q) runSearch(v.q);
  else if (v.type === 'pubpl') loadPub(v.owner, v.id);
  else if (v.type === 'library' && S.lib.chip === 'community' && !S.community.loaded) loadCommunity();
}
function step(d){ const i = S.hpos + d; if (i < 0 || i >= S.hist.length) return; S.hpos = i; go(S.hist[i], false); }
function setQueueOpen(open){ S.qopen = open; $('#qdrawer').classList.toggle('open', open); $('#bQueue').classList.toggle('act', open); }

/* ---------- Rendu ---------- */
function tracksOf(src){
  if (src === 'main') return S.home.main.tracks;
  if (src === 'fresh') return S.home.fresh.tracks;
  if (src === 'recent') return S.history;
  if (src && src.startsWith('shelf:')) return (S.home.shelves[src.slice(6)] || {}).tracks || [];
  if (src === 'list') return S.list.tracks;
  if (src === 'search') return S.search.tracks;
  if (src === 'artist') return S.artist.tracks;
  if (src === 'pub') return (S.pub.data || {tracks:[]}).tracks;
  if (src === 'pl') return (curPl() || {tracks:[]}).tracks;
  return [];
}
const defaultSrc = () => ({home:'main', list:'list', search:'search', playlist:'pl', artist:'artist', pubpl:'pub'}[S.view.type]);
const countText = l => plural(l.length, 'song');
const playActions = () => `<button class="btn" data-act="playall">${ic('play')}Play</button><button class="ghost" data-act="shuffleall">${ic('shuffle')}Shuffle</button>`;

/* ---------- Images (glisser-déposer) ---------- */
function toDataURL(src, w, maxH, square){
  return new Promise((res, rej) => {
    const img = new Image(); if (typeof src === 'string' && !src.startsWith('blob:')) img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight, dh;
        if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; dh = w; }
        else { dh = Math.round(w * sh / sw); if (dh > maxH) { const cut = sh - sw * maxH / w; sy = cut / 2; sh -= cut; dh = maxH; } }
        c.width = w; c.height = dh; c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, dh);
        res(c.toDataURL('image/jpeg', .85));
      } catch (e) { rej(e); }
    };
    img.onerror = () => rej(new Error('image'));
    img.src = src;
  });
}
async function setImage(p, kind, src){
  const isFile = src instanceof Blob, url = isFile ? URL.createObjectURL(src) : src;
  let data;
  try { data = kind === 'cover' ? await toDataURL(url, 360, 360, true) : await toDataURL(url, 1280, 720, false); }
  catch { if (isFile) { toast('Impossible de lire cette image'); return; } data = src; }
  finally { if (isFile) URL.revokeObjectURL(url); }
  p[kind] = data; if (kind === 'banner') p.bannerY = 50;
  save(); render(); toast(kind === 'cover' ? 'Image de la playlist mise à jour' : 'Bannière mise à jour');
}

function dropSource(dt){
  const f = [...dt.files].find(x => x.type.startsWith('image/')); if (f) return f;
  const u = (dt.getData('text/uri-list') || '').split('\n').find(x => x && !x.startsWith('#'));
  if (u && /^https?:|^data:image/.test(u)) return u.trim();
  const m = /<img[^>]+src="([^"]+)"/i.exec(dt.getData('text/html') || ''); return m ? m[1] : null;
}
const isTrackDrag = e => e.dataTransfer && [...e.dataTransfer.types].includes('application/x-saturne');
const hasImageDrag = e => e.dataTransfer && [...e.dataTransfer.types].some(t => t === 'Files' || t === 'text/uri-list' || t === 'text/html');
const clearOver = () => document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
document.addEventListener('dragover', e => {
  const t = e.target.closest('[data-drop],[data-pl],[data-dropq]');
  const ok = t && (t.dataset.drop ? !isTrackDrag(e) && hasImageDrag(e) : isTrackDrag(e));
  if (ok) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; if (!t.classList.contains('over')) { clearOver(); t.classList.add('over'); } }
  else { clearOver(); if (hasImageDrag(e) && !isTrackDrag(e)) e.preventDefault(); }
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) clearOver(); });
document.addEventListener('dragend', clearOver);
document.addEventListener('drop', e => {
  const t = e.target.closest('[data-drop],[data-pl],[data-dropq]'); clearOver();
  if (isTrackDrag(e)) {
    if (!t) return; e.preventDefault();
    let tr; try { tr = JSON.parse(e.dataTransfer.getData('application/x-saturne')); } catch { return; }
    if (t.dataset.pl) { const p = S.playlists.find(x => x.id === t.dataset.pl); if (p) addToPlaylist(p, tr); }
    else if (t.dataset.dropq === '1') addToQueue(tr);
    return;
  }
  if (hasImageDrag(e)) {
    e.preventDefault();
    if (t && t.dataset.drop === 'avatar') { const f = dropSource(e.dataTransfer); if (f instanceof Blob) uploadAvatar(f); else toast('Dépose un fichier image'); return; }
    const p = curPl(); if (!p || !t || !t.dataset.drop) return;
    const src = dropSource(e.dataTransfer); if (!src) return toast('Dépose un fichier image');
    setImage(p, t.dataset.drop === 'pfp' ? 'cover' : 'banner', src);
  }
});

const DEFAULT_SETTINGS = {seen:'', autoplay:true, remember:true, toasts:true, accent:'violet', radius:'soft', heroAuto:true, reduceMotion:false, autoUpdate:true};
function applyTheme(){
  const a = ACCENTS[S.settings.accent] || ACCENTS.violet, st = document.documentElement.style;
  st.setProperty('--accent', a[0]); st.setProperty('--accent-hi', a[1]); st.setProperty('--accent-soft', a[2]); st.setProperty('--accent-glow', a[3]);
  document.documentElement.dataset.radius = ['square', 'soft', 'round'].includes(S.settings.radius) ? S.settings.radius : 'soft';
  document.documentElement.classList.toggle('no-motion', !!S.settings.reduceMotion);
}
function setCollapsed(v){
  S.collapsed = v; $('#app').classList.toggle('collapsed', v); // pas de re-rendu : la transition CSS fait l'animation
  const cb = $('#collapse'); cb.setAttribute('aria-label', v ? 'Agrandir la barre latérale' : 'Réduire la barre latérale'); cb.title = cb.getAttribute('aria-label');
  save(); if (S.view.type === 'settings') renderView();
}
function toggleSetting(k){
  if (k === 'collapsed') return setCollapsed(!S.collapsed);
  S.settings[k] = !S.settings[k];
  if (k === 'reduceMotion') applyTheme();
  save(); renderView();
}

/* ---------- Partage de playlists (code à copier) ---------- */
const b64url = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64url = t => Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - t.length % 4) % 4)), c => c.charCodeAt(0));
async function encodeShare(p){
  const data = JSON.stringify({v:1, n:p.name, d:p.description || '', t:p.tracks.slice(0, 300).map(t => [t.id, t.title, t.channel, t.duration || 0])});
  const zipped = new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('gzip')));
  return 'SATURNE1.' + b64url(new Uint8Array(await zipped.arrayBuffer()));
}
async function decodeShare(code){
  const m = /^SATURNE1\.([A-Za-z0-9_-]+)$/.exec(String(code).replace(/\s+/g, ''));
  if (!m || m[1].length > 400000) throw new Error('Ce code n\'est pas valide');
  let text = '';
  try {
    const reader = new Blob([unb64url(m[1])]).stream().pipeThrough(new DecompressionStream('gzip')).getReader(), dec = new TextDecoder();
    for (;;) { const {done, value} = await reader.read(); if (done) break; text += dec.decode(value, {stream:true}); if (text.length > 3e6) throw new Error('trop gros'); }
  } catch { throw new Error('Ce code est abîmé ou incomplet'); }
  let j; try { j = JSON.parse(text); } catch { throw new Error('Ce code est abîmé ou incomplet'); }
  const clip = (s, n) => String(s ?? '').slice(0, n);
  const tracks = (Array.isArray(j.t) ? j.t : []).slice(0, 300).filter(r => Array.isArray(r) && /^[\w-]{11}$/.test(r[0])).map(r => ({id:r[0], title:clip(r[1], 200) || 'Titre', channel:clip(r[2], 100), channelId:'', thumb:`https://i.ytimg.com/vi/${r[0]}/mqdefault.jpg`, duration:Number(r[3]) > 0 ? Math.round(Number(r[3])) : null}));
  if (!tracks.length) throw new Error('Ce code ne contient aucun titre');
  return {name:clip(j.n, 60) || 'Playlist importée', description:clip(j.d, 160), tracks};
}
function shareModal(p){
  openModal(`<h3>Share « ${esc(p.name)} »</h3><p>Envoie ce code à quelqu'un : dans Saturne, il va dans <b>Your Library › Import</b> et le colle pour récupérer la playlist (${plural(Math.min(p.tracks.length, 300), 'titre')}).</p>
    <textarea class="codebox" id="shCode" readonly aria-label="Code de partage">Génération du code…</textarea>
    <div class="mactions"><button class="ghost" data-mclose>Fermer</button><button class="btn" id="shCopy" disabled>${ic('copy')}Copy code</button></div>`,
  async m => {
    const box = m.querySelector('#shCode'), btn = m.querySelector('#shCopy');
    try { box.value = await encodeShare(p); btn.disabled = false; } catch { box.value = 'Impossible de générer le code.'; return; }
    box.addEventListener('focus', () => box.select());
    btn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(box.value); } catch { box.select(); try { document.execCommand('copy'); } catch {} }
      toast('Code copié');
    });
  });
}
function importModal(){

/* ---------- Mises à jour (GitHub) ---------- */
async function checkUpdate(silent){
  if (S.update.checking) return;
  S.update.checking = true; S.update.error = ''; if (S.view.type === 'settings') renderView();
  try { S.update.info = await http('/api/update/check'); if (!silent && !S.update.info.available) toast('Saturne est à jour'); }
  catch (e) { S.update.error = e.message; if (!silent) toast(e.message); }
  S.update.checking = false; renderUpdateBanner(); if (S.view.type === 'settings') renderView();
}
function renderUpdateBanner(){
  const b = $('#updBanner'), i = S.update.info;
  if (i && i.available) { b.hidden = false; b.innerHTML = `<span><b>Saturne ${esc(i.latest)}</b>disponible</span><button class="btn" data-act="installupdate">Update</button>`; }
  else { b.hidden = true; b.innerHTML = ''; }
}
$('#updBanner').addEventListener('click', e => { if (e.target.closest('[data-act="installupdate"]')) installUpdate(); });
async function installUpdate(){
  const i = S.update.info; if (!i || !i.available || S.update.installing) return;
  if (!i.canInstall) {
    const link = /^https:\/\/github\.com\//.test(i.url || '') ? `<a href="${esc(i.url)}" target="_blank" rel="noopener" style="color:var(--accent-hi)">Ouvrir la page de la release</a>` : '';
    return openModal(`<h3>Installation manuelle</h3><p>La release ${esc(i.latest)} n'a pas d'empreinte de sécurité (SHA-256) : Saturne refuse de l'installer automatiquement. Télécharge-la depuis GitHub.</p><p>${link}</p><div class="mactions"><button class="btn" data-mclose>OK</button></div>`);
  }
  S.update.installing = true;
  openModal(`<h3>Mise à jour vers ${esc(i.latest)}</h3><p id="upMsg">Téléchargement et vérification…</p>`);
  try { await send('/api/update/install', {}); $('#upMsg').textContent = 'Saturne redémarre…'; await waitForRestart(); }
  catch (e) { S.update.installing = false; closeModal(); toast(e.message); }
}
async function waitForRestart(){
  let down = false;
  for (let n = 0; n < 75; n++) {
    await new Promise(r => setTimeout(r, 800));
    try { await fetch('/api/me'); if (down || n > 8) return location.reload(); } catch { down = true; }
  }
  location.reload();
}
function exportData(){
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(payload(), null, 2)], {type:'application/json'})); a.download = 'saturne-data.json';
    document.body.appendChild(a); a.click(); a.remove(); toast('Export lancé');
  } catch (e) { toast('Export impossible : ' + e.message); }
}

  closeDD(); const d = DD[btn.dataset.dd], m = $('#ddmenu'), cur = d.value();
  m.innerHTML = d.opts().map(([v, n]) => `<button role="option" data-val="${esc(v)}" aria-selected="${v === cur}" class="${v === cur ? 'sel' : ''}"><span>${esc(n)}</span>${v === cur ? ic('check') : ''}</button>`).join('');
  m.hidden = false; btn.setAttribute('aria-expanded', 'true'); ddOpen = {btn, key:btn.dataset.dd};
  const r = btn.getBoundingClientRect(); m.style.minWidth = r.width + 'px';
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + 6 + h > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
  (m.querySelector('.sel') || m.firstElementChild).focus();
}
$('#ddmenu').addEventListener('click', e => { const o = e.target.closest('[data-val]'); if (!o || !ddOpen) return; const key = ddOpen.key; closeDD(true); DD[key].set(o.dataset.val); });
$('#ddmenu').addEventListener('keydown', e => {
  const items = [...$('#ddmenu').children], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if (e.key === 'Escape') { e.stopPropagation(); closeDD(true); }
  else if (e.key === 'Tab') closeDD();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dd]');
  if (b) { e.stopPropagation(); return ddOpen && ddOpen.btn === b ? closeDD() : openDD(b); }
  if (ddOpen && !e.target.closest('#ddmenu')) closeDD();
}, true);
document.addEventListener('keydown', e => { if (e.key === 'ArrowDown' && e.target.matches && e.target.matches('[data-dd]') && !ddOpen) { e.preventDefault(); openDD(e.target); } });

/* ---------- Infobulles (progression, volume, barre latérale repliée) ---------- */
function showTip(x, y, text, side){ const t = $('#tip'); t.textContent = text; t.dataset.side = side || 'top'; t.style.left = x + 'px'; t.style.top = y + 'px'; t.hidden = false; }
const hideTip = () => { $('#tip').hidden = true; };
seek.addEventListener('mousemove', e => { const r = seek.getBoundingClientRect(), p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); showTip(e.clientX, r.top - 6, fmt(p * (+seek.max || 0)), 'top'); });
seek.addEventListener('mouseleave', hideTip);
let volTipTimer = 0;
const showVolTip = () => { const r = vol.getBoundingClientRect(); showTip(r.left + 6.5 + (S.volume / 100) * (r.width - 13), r.top - 6, S.muted ? 'Muet' : S.volume + '%', 'top'); };
vol.addEventListener('input', () => { showVolTip(); clearTimeout(volTipTimer); volTipTimer = setTimeout(hideTip, 1200); });
vol.addEventListener('mouseenter', showVolTip); vol.addEventListener('mouseleave', hideTip);
$('#side').addEventListener('mouseover', e => {
  if (!S.collapsed || innerWidth <= 900) return;
  const el = e.target.closest('.nav button, .pli, .account'); if (!el) return;
  const r = el.getBoundingClientRect();
  showTip(r.right + 10, r.top + r.height / 2, el.classList.contains('account') ? $('#accName').textContent : (el.dataset.tip || el.title || el.textContent.trim()), 'right');
});
$('#side').addEventListener('mouseout', e => { if (e.target.closest('.nav button, .pli, .account')) hideTip(); });
$('#side').addEventListener('scroll', hideTip, true);

/* ---------- Annuler ---------- */
function deletePlaylist(p){
  const idx = S.playlists.indexOf(p);
  S.playlists = S.playlists.filter(x => x.id !== p.id); save();
  toast('Playlist « ' + p.name + ' » supprimée', {undo:() => { S.playlists.splice(Math.min(idx, S.playlists.length), 0, p); save(); render(); }});
}
function removeTrackAt(list, i){
  const [rm] = list.splice(i, 1); save(); render();
  toast('Titre retiré', {undo:() => { list.splice(Math.min(i, list.length), 0, rm); save(); render(); }});
}

/* ---------- Now playing ---------- */
function nowHtml(){
  const t = current();
  if (!t) return `<div class="pagehead"><p class="eyebrow">Now playing</p><h1>Rien en lecture</h1><p class="sub">Lance un titre pour le voir ici.</p></div>`;
  const nextUp = S.order.slice(S.pos + 1, S.pos + 7).map(i => ({i, t:S.queue[i]})).filter(x => x.t);
  return `<div class="np-page"><div class="np-art"><img src="https://i.ytimg.com/vi/${esc(t.id)}/maxresdefault.jpg" alt="" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${esc(t.thumb)}'}"></div>
    <div class="np-info"><p class="eyebrow">Now playing</p><h1>${esc(t.title)}</h1><p class="sub" style="margin-bottom:20px">${chLink(t)}${t.duration ? ' · ' + fmt(t.duration) : ''}</p>
      <div class="head-actions">${bmBtn(t)}<button class="ghost" data-act="npmenu">${ic('plus')}Add to playlist</button><button class="ghost" data-act="qqueue">${ic('queue')}Queue</button></div>
      ${nextUp.length ? `<h4 class="np-h">Next up</h4><div class="np-list">${nextUp.map(x => `<button class="mini-row" data-act="qjump" data-qi="${x.i}"><img src="${esc(x.t.thumb)}" alt=""><span class="m"><b>${esc(x.t.title)}</b><small>${esc(x.t.channel)}</small></span></button>`).join('')}</div>` : ''}</div></div>`;
}
$('#nowImg').addEventListener('click', () => go({type:'now'}));
$('#nowTitle').addEventListener('click', () => { if (current()) go({type:'now'}); });

/* ---------- Changelog (liste repliable) ---------- */

const CHANGELOG = [
  {v:'0.4.0', date:'Nov 2026', title:'Finitions du design, menus et changelog', changes:[
    ['new', 'Page « Now playing » : clique sur la pochette en bas pour l\'ouvrir.'],
    ['new', 'Menus déroulants modernes (tri des playlists, région de recherche), utilisables au clavier.'],
    ['new', 'Changelog repliable dans Settings, avec « Expand all » et « Collapse all ».'],
    ['new', 'Bouton « Annuler » après la suppression d\'une playlist, d\'un titre ou de la file.'],
    ['new', 'Pochettes de playlists en mosaïque quand il y a au moins 4 titres.'],
    ['new', 'Infobulles : temps sous la souris sur la progression, pourcentage du volume, noms dans la barre repliée.'],
    ['improved', 'Une seule famille d\'icônes, en trait fin, sur toute l\'application.'],
    ['improved', 'Transition en fondu entre les pages, avec apparition échelonnée des cartes.'],
    ['improved', 'Titres sur deux lignes dans les cartes, espacements et gris harmonisés, animations des fenêtres et des notifications.'],
    ['fixed', 'Certaines pochettes de playlists laissaient une bande vide en haut et en bas.']]},
  {v:'0.3.0', date:'Nov 2026', title:'Réglages, profil, partage et mises à jour', changes:[
    ['new', 'Réglages classés par catégories : compte, général, lecture, apparence, confidentialité, données, mises à jour.'],
    ['new', 'Profil modifiable : photo, nom affiché, identifiant et mot de passe, suppression du compte.'],
    ['new', 'Partage de playlist par code à copier, et import dans Your Library.'],
    ['new', 'Mises à jour via les releases GitHub, vérifiées par empreinte SHA-256.'],
    ['improved', 'Bookmark jaune, boutons du hero fixes, repli animé de la barre latérale.']]},
  {v:'0.2.0', date:'Nov 2026', title:'Saturne : comptes et playlists publiques', changes:[
    ['new', 'L\'application devient Saturne, en Rust, avec une fenêtre native et un installeur.'],
    ['new', 'Comptes avec mots de passe hachés (Argon2id) et données séparées par utilisateur.'],
    ['new', 'Playlists privées ou publiques, onglet Community, « Save to library ».'],
    ['new', 'Hero des sorties les plus récentes, lecteur caché (audio seul), bookmark animé.']]},
  {v:'0.1.0', date:'Nov 2026', title:'Première version (Onde)', changes:[
    ['new', 'Recherche YouTube sans clé, lecture complète, playlists, favoris et file d\'attente.'],
    ['new', 'Page Artists, genres, glisser-déposer de la pochette et de la bannière des playlists.']]}
];
const clOpen = new Set([CHANGELOG[0].v]);
function changelogHtml(){
  const ver = (S.about && S.about.version) || CHANGELOG[0].v;
  return `<h2>Changelog</h2><p class="lead">Ce qui change à chaque version de Saturne.</p>
    <div class="head-actions" style="margin-bottom:14px"><button class="ghost" data-clall="open">${ic('down')}Expand all</button><button class="ghost" data-clall="close">${ic('up')}Collapse all</button></div>
    <div class="cl">${CHANGELOG.map((c, i) => `<div class="cl-item ${clOpen.has(c.v) ? 'open' : ''}" data-v="${c.v}">
      <button class="cl-head" data-cl="${c.v}" aria-expanded="${clOpen.has(c.v)}"><span class="cl-v">v${c.v}</span>${i === 0 ? '<span class="badge2">Latest</span>' : ''}${c.v === ver ? '<span class="badge2 on">Installed</span>' : ''}<span class="cl-t">${esc(c.title)}</span><span class="cl-d">${esc(c.date)}</span>${ic('chevd')}</button>
      <div class="cl-body"><div class="cl-in"><div class="cl-list">${c.changes.map(([k, t]) => `<div class="cl-row"><span class="cl-tag ${k}">${TAGS[k]}</span><span>${esc(t)}</span></div>`).join('')}</div></div></div></div>`).join('')}</div>`;
}
function setCl(item, open){
  item.classList.toggle('open', open); item.querySelector('.cl-head').setAttribute('aria-expanded', open);
  if (open) clOpen.add(item.dataset.v); else clOpen.delete(item.dataset.v);
}
const toggleCl = v => { const it = document.querySelector(`.cl-item[data-v="${CSS.escape(v)}"]`); if (it) setCl(it, !it.classList.contains('open')); };
const setAllCl = open => document.querySelectorAll('.cl-item').forEach(it => setCl(it, open));
/* Après une mise à jour : une notification propose de lire les nouveautés. */
async function announceVersion(){
  try {
    S.about = S.about || await http('/api/about');
    const v = S.about.version, seen = S.settings.seen;
    if (seen !== v) {
      S.settings.seen = v; save();
      if (seen) toast('Saturne ' + v + ' est installé', {label:'Voir les nouveautés', undo:() => { S.setTab = 'changelog'; go({type:'settings'}); }});
    }
  } catch {}
}

/* ---------- Démarrage ---------- */
applyTheme();
(async function boot(){
  try {
    const j = await http('/api/me');
    if (j.user) return enter(j.user);
    showAuth();
  } catch (e) { showAuth(errText(e)); }
})();
</script>
